# ===================================================
# KODEXIS Render Blueprint (render.yaml)
# Deploy both Frontend & Backend with 1-Click on Render
# ===================================================

services:
  # 1. Spring Boot 3.3 Backend API Service
  - type: web
    name: kodexis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/learning/knowledge/topics
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # 2. React + Vite Frontend Single Page Application
  - type: web
    name: kodexis-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kodexis-backend
          property: host
