# Server Configuration (Render injects PORT dynamically)
server.port=${PORT:8080}

# Database Configuration (Persistent H2 File DB with PostgreSQL Compatibility, or Render PostgreSQL via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kodexisdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Configuration (Allowed for debugging / inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# JWT Configuration
kodexis.jwt.secret=${JWT_SECRET:5f4dcc3b5aa765d61d8327deb882cf995f4dcc3b5aa765d61d8327deb882cf99}
kodexis.jwt.expiration=86400000

# Mistral AI API Settings (optional fallback for cloud deployment)
kodexis.mistral.key=${MISTRAL_API_KEY:demo_mistral_api_key}
kodexis.mistral.url=${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
kodexis.mistral.model=${MISTRAL_MODEL:open-mistral-7b}
